version: '3.8'

services:
  # -------------------------------
  # 1) etcd 服务，Milvus 的元数据存储
  # -------------------------------
  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    container_name: milvus-etcd
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    volumes:
      - ./volumes/etcd:/etcd
    command: >
      etcd 
      -advertise-client-urls=http://0.0.0.0:2379 
      -listen-client-urls=http://0.0.0.0:2379 
      --data-dir=/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health", "--endpoints=http://127.0.0.1:2379"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -------------------------------
  # 2) MinIO 服务，用作 Milvus 的对象存储
  # -------------------------------
  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    container_name: milvus-minio
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    volumes:
      - ./volumes/minio:/minio_data
    command: server /minio_data
    ports:
      - "9000:9000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # -------------------------------
  # 3) Milvus Standalone
  # -------------------------------
  milvus-standalone:
    image: milvusdb/milvus:v2.2.11
    container_name: milvus-standalone
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - ./volumes/milvus:/var/lib/milvus
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy

  # -------------------------------
  # 4) Redis，用于队列 + 缓存
  # -------------------------------
  redis:
    image: redis:7
    container_name: cy-redis
    ports:
      - "6379:6379"

  # -------------------------------
  # 5) MySQL，用于存储 SKU/图片元数据
  # -------------------------------
  mysql:
    image: mysql:8.0
    container_name: cy-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: image_search
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -------------------------------
  # 6) Python 特征推理服务
  # -------------------------------
  model-service:
    build: ./model-service
    container_name: cy-model-service
    ports:
      - "5000:5000"
    depends_on:
      - redis
      - mysql

volumes:
  mysql_data:
